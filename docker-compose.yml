
services:
  app:
    build: .
    container_name: website_pay
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/entrypoint.sh"]
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_URL: ""
    ports:
      - "${APP_PORT}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - laravel_storage:/app/storage
      - laravel_cache:/app/bootstrap/cache

  mysql:
    image: mysql:8.0
    container_name: website_pay-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  laravel_storage:
  laravel_cache:
