services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: website-pay
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-website_pay}
      DB_USERNAME: ${DB_USERNAME:-website_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret123}
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - website-net

  db:
    image: mysql:8.0
    container_name: website-pay-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-website_pay}
      MYSQL_USER: ${DB_USERNAME:-website_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
    command: ["--default-authentication-plugin=mysql_native_password"]
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - website-net

volumes:
  db_data:

networks:
  website-net:
    driver: bridge
